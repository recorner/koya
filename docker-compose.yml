version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: koya-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: koya-api
    ports:
      - '127.0.0.1:3333:3333'
    env_file:
      - docker/api.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./libs/bria-adapter/proto:/proto:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Bitcoin Regtest Node ───────────────────────────────────
  bitcoind:
    image: lncm/bitcoind:v27.0
    container_name: koya-bitcoind
    command:
      - -regtest
      - -server
      - -txindex
      - -rpcuser=koya
      - -rpcpassword=koya_regtest
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -fallbackfee=0.00001
      - -zmqpubrawblock=tcp://0.0.0.0:28332
      - -zmqpubrawtx=tcp://0.0.0.0:28333
    ports:
      - '127.0.0.1:18443:18443'
      - '127.0.0.1:28332:28332'
      - '127.0.0.1:28333:28333'
    volumes:
      - bitcoind_data:/home/bitcoin/.bitcoin
    healthcheck:
      test: ['CMD', 'bitcoin-cli', '-regtest', '-rpcuser=koya', '-rpcpassword=koya_regtest', 'getblockchaininfo']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ── Electrs (Electrum server for Bria) ─────────────────────
  # Shares network namespace with Bria so electrs is at 127.0.0.1:50001 from Bria's perspective
  # (Bria hardcodes 127.0.0.1:50001 for regtest, ignoring config)
  electrs:
    image: ghcr.io/vulpemventures/electrs:latest
    container_name: koya-electrs
    network_mode: "service:bria"
    entrypoint:
      - /build/electrs
      - --network
      - regtest
      - --daemon-rpc-addr
      - bitcoind:18443
      - --cookie
      - koya:koya_regtest
      - --electrum-rpc-addr
      - 0.0.0.0:50001
      - --jsonrpc-import
      - -vvv
    depends_on:
      bria:
        condition: service_started
      bitcoind:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: unless-stopped

  # ── Bria Infrastructure ────────────────────────────────────
  bria-pg:
    image: postgres:16-alpine
    container_name: koya-bria-pg
    environment:
      POSTGRES_DB: bria
      POSTGRES_USER: bria
      POSTGRES_PASSWORD: bria_dev_password
    volumes:
      - bria_pg_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bria']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Bria — Bitcoin Custody & Payout ────────────────────────
  bria:
    image: us.gcr.io/galoy-org/bria:0.1.131
    container_name: koya-bria
    command: ["bria", "daemon", "run"]
    ports:
      - '127.0.0.1:2742:2742'
      - '127.0.0.1:2743:2743'
    env_file:
      - docker/bria.env
    volumes:
      - ./config/bria.yml:/etc/bria/bria.yml:ro
    healthcheck:
      test: ['CMD', 'bria', 'list-profiles']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      bria-pg:
        condition: service_healthy
    restart: unless-stopped

  # ── MongoDB (TinaCMS content index) ─────────────────────────
  tina-mongo:
    image: mongo:7-jammy
    container_name: koya-tina-mongo
    ports:
      - '127.0.0.1:27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: tina
      MONGO_INITDB_ROOT_PASSWORD: ${TINA_MONGO_PASSWORD:-tina_dev_password}
    volumes:
      - tina_mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── TinaCMS Admin ──────────────────────────────────────────
  tina:
    build:
      context: .
      dockerfile: Dockerfile.tina
    container_name: koya-tina
    ports:
      - '127.0.0.1:3001:3001'
    environment:
      - NODE_ENV=production
      - TINA_PUBLIC_IS_LOCAL=false
      - TINA_AUTH_SECRET=${TINA_AUTH_SECRET}
      - MONGODB_URI=mongodb://tina:${TINA_MONGO_PASSWORD:-tina_dev_password}@tina-mongo:27017/tinacms?authSource=admin
      - GITHUB_OWNER=westronet
      - GITHUB_REPO=koya
      - GITHUB_BRANCH=main
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PERSONAL_ACCESS_TOKEN}
    volumes:
      - ./apps/web/content:/app/content
      - ./apps/web/tina/auth/users.json:/app/tina/auth/users.json
    depends_on:
      tina-mongo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  bitcoind_data:
  bria_pg_data:
  tina_mongo_data:
