version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: koya-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: koya-api
    ports:
      - '127.0.0.1:3333:3333'
    env_file:
      - docker/api.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./libs/bria-adapter/proto:/proto:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Bria Infrastructure ────────────────────────────────────
  bria-pg:
    image: postgres:16-alpine
    container_name: koya-bria-pg
    environment:
      POSTGRES_DB: bria
      POSTGRES_USER: bria
      POSTGRES_PASSWORD: bria_dev_password
    volumes:
      - bria_pg_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bria']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Bria — Bitcoin Custody & Payout ────────────────────────
  bria:
    image: us.gcr.io/galoy-org/bria:latest
    container_name: koya-bria
    command: ["bria", "daemon", "run"]
    ports:
      - '0.0.0.0:2742:2742'
      - '0.0.0.0:2743:2743'
    env_file:
      - docker/bria.env
    volumes:
      - ./config/bria.yml:/etc/bria/bria.yml:ro
    healthcheck:
      test: ['CMD', 'bria', 'list-profiles']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      bria-pg:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  bria_pg_data:
