# Bria Configuration — Koya Testnet4
# Network: Bitcoin testnet4 via remote Electrum endpoint
# Note: Replace electrum_url with your preferred Electrum server.
# Public testnet4 options: mempool.space:60601, blockstream.info:60601

blockchain:
  network: testnet4
  electrum_url: "mempool.space:40002"

api:
  listen_port: 2742

admin:
  listen_port: 2743

db:
  pool_size: 20
  migrate_on_start: true

tracing:
  host: "localhost"
  port: 4317
  service_name: "bria-koya"

jobs:
  sync_all_wallets_delay: 10
  process_all_payout_queues_delay: 10
  respawn_all_outbox_handlers_delay: 10
  signing:
    warn_retries: 2
    max_attempts: 5
    max_retry_delay: 3600

fees:
  mempool_space: {}

security:
  blocked_addresses: []
