# ─────────────────────────────────────────────────────────────────────────────
# Koya — nginx configuration for api.koyabank.com (NestJS API)
# Place at: /etc/nginx/sites-available/api.koyabank.com
# Enable:   ln -s /etc/nginx/sites-available/api.koyabank.com /etc/nginx/sites-enabled/
# ─────────────────────────────────────────────────────────────────────────────

# Redirect HTTP to HTTPS
server {
    listen      80;
    listen      [::]:80;
    server_name api.koyabank.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://api.koyabank.com$request_uri;
    }
}

# HTTPS — reverse proxy to NestJS
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name api.koyabank.com;

    # ── SSL (Let's Encrypt) ──────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/api.koyabank.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.koyabank.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options     nosniff                                        always;
    add_header X-Frame-Options            DENY                                           always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"              always;

    # ── CORS preflight (handled in NestJS, but nginx can short-circuit OPTIONS)
    # Uncomment if needed:
    # if ($request_method = OPTIONS) {
    #     add_header Access-Control-Allow-Origin  "https://koyabank.com";
    #     add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
    #     add_header Access-Control-Allow-Headers "Authorization, Content-Type";
    #     add_header Access-Control-Max-Age       86400;
    #     return 204;
    # }

    # ── Logging ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/api.koyabank.com.access.log;
    error_log  /var/log/nginx/api.koyabank.com.error.log;

    # ── Rate limiting (zone defined in /etc/nginx/conf.d/koya-rate-limit.conf) ─

    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass         http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # Increase body size for file uploads / M-Pesa callbacks
        client_max_body_size 10M;
    }

    # Block access to anything outside /api/
    location / {
        return 404;
    }
}
