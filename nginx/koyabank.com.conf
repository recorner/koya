# ─────────────────────────────────────────────────────────────────────────────
# Koya — nginx configuration for koyabank.com (frontend)
# Place at: /etc/nginx/sites-available/koyabank.com
# Enable:   ln -s /etc/nginx/sites-available/koyabank.com /etc/nginx/sites-enabled/
# ─────────────────────────────────────────────────────────────────────────────

# Redirect bare HTTP to HTTPS
server {
    listen      80;
    listen      [::]:80;
    server_name koyabank.com www.koyabank.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://koyabank.com$request_uri;
    }
}

# Redirect www → apex HTTPS
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name www.koyabank.com;

    ssl_certificate     /etc/letsencrypt/live/koyabank.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/koyabank.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://koyabank.com$request_uri;
}

# Main HTTPS — reverse proxy to Next.js
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name koyabank.com;

    # ── SSL (Let's Encrypt) ──────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/koyabank.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/koyabank.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            DENY                                           always;
    add_header X-Content-Type-Options     nosniff                                        always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()"     always;

    # ── Logging ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/koyabank.com.access.log;
    error_log  /var/log/nginx/koyabank.com.error.log;

    # ── Proxy to Next.js (port 3000) ─────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # ── Next.js static assets — long cache ───────────────────────────────────
    location /_next/static/ {
        proxy_pass         http://127.0.0.1:3000/_next/static/;
        proxy_set_header   Host $host;
        expires            365d;
        add_header         Cache-Control "public, immutable";
    }
}
